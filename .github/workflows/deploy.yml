name: Deploy to Cloudflare Workers

# The site deploys as a Cloudflare Worker (EmDash CMS needs a server runtime;
# see plans/006-migrate-to-emdash.md). `astro build` bundles src/worker.ts and
# emits the deployable config at site/dist/server/wrangler.json (wrangler
# follows site/.wrangler/deploy/config.json to find it), with prerendered
# HTML + .md mirrors served from site/dist/client as static assets.
# Pushes to main that touch site/** are what deploy — nothing rebuilds on
# the Cloudflare side by itself.
#
# EmDash schema migrations run automatically at runtime on first request
# after a deploy (the default runtime-migrations mode).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: workers-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        working-directory: site
        run: npm ci

      - name: Install Python dependencies (pinned — see scripts/requirements.txt)
        working-directory: site
        run: python -m pip install -r scripts/requirements.txt

      - name: Validate entity fields (HTML allowlist + https url enforcement)
        working-directory: site
        run: npm run check:entities

      - name: Build (astro build + md mirrors)
        working-directory: site
        run: npm run build

      - name: Run tests (negotiation/redirects)
        working-directory: site
        run: npm test

      # Uses the wrangler pinned in site/package.json devDependencies so CI
      # and local deploys agree. `wrangler deploy` follows the build-emitted
      # config redirect (site/.wrangler/deploy/config.json -> dist/server/
      # wrangler.json), which carries the D1/R2/assets bindings.
      - name: Deploy Worker to Cloudflare
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Post-deploy smoke: readiness invariants incl. the runtime sitemaps and
      # CMS-served Insights articles, against the Worker that just shipped.
      - name: Agent-readiness invariants against the deployed Worker
        working-directory: site
        env:
          SITE_URL: https://eagleridge.mcconnell-chris.workers.dev
        run: npm run check:agent-readiness
